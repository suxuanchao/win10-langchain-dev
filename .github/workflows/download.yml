name: Download RAG Dependencies for Win10

on:
  workflow_dispatch:

jobs:
  download-rag-deps:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 匹配你的离线 Win10 环境

      - name: Download RAG Dependencies
        run: |
          mkdir pkgs
          # 1. 核心框架
          pip download langchain langchain-community langchain-core langchain-ollama -d ./pkgs
          # 2. 文档解析 (Word, PDF, Excel, CSV, 图片OCR)
          pip download pandas openpyxl pypdf PyMuPDF docx2txt Pillow rapidocr-onnxruntime -d ./pkgs
          # 3. 向量数据库与分词器
          pip download faiss-cpu tiktoken -d ./pkgs
          
      - name: Verify Packages
        run: |
          if not exist pkgs\*.whl (
            echo ERROR: No .whl files found!
            exit 1
          )
          dir /b pkgs\*.whl | find /c /v "" > count.txt
          set /p number=<count.txt
          echo Total packages downloaded: %number%

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win10-rag-pkgs
          path: pkgs/
